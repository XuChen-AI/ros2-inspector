[project]
name = "ros2-inspector"
version = "0.1.0"
description = "只读 ROS2 系统巡检 MCP Server：让大模型通过 MCP 查看 ROS2 节点/话题/参数/动作"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.10.0,<2",
]

[project.scripts]
ros2-inspector = "ros2_inspector.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ros2_inspector"]
